<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Our Machine</title>
<link rel="stylesheet" href="style.css">

<style>

.info-box{
display:none;
margin-top:25px;
padding:30px;
border-radius:20px;
max-width:800px;
margin:auto;
color:white;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.machine-img{
width:100%;
max-width:250px;
margin:10px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

.machine-img:hover{
transform:scale(1.05);
transition:0.3s;
}

</style>

</head>

<body>

<div class="hero">
<div class="overlay"></div>

<div class="content">

<h1 id="title">About Our Machine</h1>

<div class="menu-buttons">

<button id="btnIntro" onclick="showIntro()">Machine Introduction</button>

<button id="btnFeatures" onclick="showFeatures()">Machine Features</button>

<button id="btnWorks" onclick="showWorks()">How It Works</button>

<button id="btnBenefits" onclick="showBenefits()">Benefits For Farmers</button>

<button id="btnPhotos" onclick="showPhotos()">Machine Photos</button>

</div>

<div class="info-box" id="infoBox">

<h2 id="infoTitle"></h2>

<div id="infoText"></div>

</div>

<br>

<button class="back-btn" onclick="goBack()" id="mainBack">Back</button>

</div>
</div>

<script>

let lang = localStorage.getItem("lang") || "english";

window.onload=function(){

const title=document.getElementById("title");

const intro=document.getElementById("btnIntro");
const features=document.getElementById("btnFeatures");
const works=document.getElementById("btnWorks");
const benefits=document.getElementById("btnBenefits");
const photos=document.getElementById("btnPhotos");

const back=document.getElementById("mainBack");

/* -------- LANGUAGE SET -------- */

if(lang==="marathi"){

title.innerText="मशीन बद्दल";

intro.innerText="मशीन परिचय";
features.innerText="मशीन वैशिष्ट्ये";
works.innerText="मशीन कशी काम करते";
benefits.innerText="शेतकऱ्यांसाठी फायदे";
photos.innerText="मशीन फोटो";

back.innerText="मेनू वर जा";

}

else if(lang==="hindi"){

title.innerText="मशीन के बारे में";

intro.innerText="मशीन परिचय";
features.innerText="मशीन की विशेषताएँ";
works.innerText="मशीन कैसे काम करती है";
benefits.innerText="किसानों के लिए लाभ";
photos.innerText="मशीन के फोटो";

back.innerText="मेनू पर जाएँ";

}

}

/* -------- FUNCTIONS -------- */

function showIntro(){
document.getElementById("infoBox").style.display="block";

if(lang==="marathi"){
setData("मशीन परिचय","ही मशीन भाज्यांची स्वयंचलित लागवड करते.");
}
else if(lang==="hindi"){
setData("मशीन परिचय","यह मशीन सब्जियों की स्वचालित रोपाई करती है।");
}
else{
setData("Machine Introduction","This machine is a multi vegetable transplanter.");
}
}

function showFeatures(){
document.getElementById("infoBox").style.display="block";

if(lang==="marathi"){
setData("मशीन वैशिष्ट्ये","रोबोटिक आर्म, कन्व्हेयर सिस्टीम आणि बॅटरी सिस्टम आहे.");
}
else if(lang==="hindi"){
setData("मशीन की विशेषताएँ","रोबोटिक आर्म और कन्वेयर सिस्टम शामिल है।");
}
else{
setData("Machine Features","Robotic arm, conveyor system and battery system.");
}
}

function showWorks(){
document.getElementById("infoBox").style.display="block";

if(lang==="marathi"){
setData("मशीन कशी काम करते","कन्व्हेयर रोपे पुढे आणतो आणि रोबोटिक आर्म लागवड करतो.");
}
else if(lang==="hindi"){
setData("मशीन कैसे काम करती है","कन्वेयर पौधों को आगे लाता है और रोबोटिक आर्म रोपाई करता है।");
}
else{
setData("How It Works","Conveyor moves trays and robotic arm plants saplings.");
}
}

function showBenefits(){
document.getElementById("infoBox").style.display="block";

if(lang==="marathi"){
setData("शेतकऱ्यांसाठी फायदे","मजुरी कमी होते आणि उत्पादन वाढते.");
}
else if(lang==="hindi"){
setData("किसानों के लिए लाभ","यह मशीन श्रम कम करती है और उत्पादन बढ़ाती है।");
}
else{
setData("Benefits For Farmers","Reduces labour and increases productivity.");
}
}

/* -------- PHOTOS -------- */

function showPhotos(){

document.getElementById("infoBox").style.display="block";

if(lang==="marathi"){
setPhotos("मशीन फोटो");
}
else if(lang==="hindi"){
setPhotos("मशीन के फोटो");
}
else{
setPhotos("Machine Photos");
}

}

/* -------- HELPER FUNCTIONS -------- */

function setData(title,text){
document.getElementById("infoTitle").innerText=title;
document.getElementById("infoText").innerText=text;
}

function setPhotos(title){
document.getElementById("infoTitle").innerText=title;

document.getElementById("infoText").innerHTML=`

<div class="gallery">
<img src="images/machine1.jpg" class="machine-img">
<img src="images/machine2.jpg" class="machine-img">
<img src="images/machine3.jpg" class="machine-img">
</div>

`;
}

function goBack(){
window.location.href="menu.html";
}

</script>

</body>
</html>
